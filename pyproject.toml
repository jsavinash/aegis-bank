[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — AI-native financial crime compliance platform (AML investigation, real-time risk, regulatory intelligence)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegis" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49",
    "opentelemetry-exporter-otlp>=1.28",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "temporalio>=1.9",
    "mcp>=1.1",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "typer>=0.13",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "faker>=30.8",
    "testcontainers>=4.8",
]
graph = ["neo4j>=5.26"]
openai = ["openai>=1.57"]
anthropic = ["anthropic>=0.40"]
ai = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "peft>=0.13",
    "unsloth>=2024.11",
    "sentence-transformers>=3.2",
    "docling>=2.9",
    "qdrant-client>=1.12",
    "llama-index>=0.12",
    "llama-index-vector-stores-qdrant>=0.4",
    "llama-index-graph-stores-neo4j>=0.4",
    "llama-index-retrievers-bm25>=0.5",
    "ollama>=0.4",
    "langfuse>=2.50",
    "ragas>=0.2",
    "nemoguardrails>=0.24",
]

[project.scripts]
aegis = "aegis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"